<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legion Rush – Télécharger</title>
<meta name="description" content="Legion Rush : mène ta légion, affronte des boss géants. Gratuit sur Google Play et l'App Store.">
<style>
:root{--bg:#141c33;--ink:#fff;--mute:#a9b6d6;--gold:#ffc83d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px;text-align:center}
main{max-width:380px;width:100%}
h1{margin:0 0 6px;font-size:30px;color:var(--gold);letter-spacing:.02em}
p{margin:0 0 22px;color:var(--mute)}
a.b{display:block;margin:10px 0;padding:14px 16px;border-radius:14px;text-decoration:none;font-weight:700;color:#fff;background:#2f6dff}
a.b.g{background:#1f8a4c}
small{display:block;margin-top:18px;color:var(--mute);font-size:12px}
small a{color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>LEGION RUSH</h1>
<p id="msg">Mène ta légion, écrase les boss géants. Gratuit.</p>
<a class="b g" id="gp" href="https://play.google.com/store/apps/details?id=com.ma2tgames.legionrush">Google Play (Android)</a>
<a class="b" id="as" href="https://apps.apple.com/app/id6820142555">App Store (iPhone, iPad)</a>
<small>MA2T Games · <a href="privacy.html">Confidentialité</a></small>
</main>
<script>
// Redirige vers la bonne boutique selon l'appareil ; sinon (ordinateur), les deux boutons restent affichés.
(function () {
  var ua = navigator.userAgent || '', q = location.search || '';
  var gp = 'https://play.google.com/store/apps/details?id=com.ma2tgames.legionrush';
  var as = 'https://apps.apple.com/app/id6820142555';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var src = /[?&]src=([\w-]{1,40})/.exec(q);
  if (src && android) gp += '&referrer=' + encodeURIComponent('utm_source=' + src[1]);
  document.getElementById('gp').href = gp;
  if (ios) { document.getElementById('msg').textContent = 'Ouverture de l’App Store…'; location.replace(as); }
  else if (android) { document.getElementById('msg').textContent = 'Ouverture de Google Play…'; location.replace(gp); }
})();
</script>
</body>
</html>
